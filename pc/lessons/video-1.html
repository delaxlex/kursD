<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Видеоурок 1-1</title>
    <style>
        /* ============================================
           ОБЩИЕ СТИЛИ
           ============================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: #1a1a2e;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* ============================================
           СТРАНИЦА С ВИДЕО
           ============================================ */
        .video-page {
            max-width: 900px;
            width: 100%;
            background: #16213e;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .video-page h1 {
            color: #fff;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .video-page .video-subtitle {
            color: rgba(255, 255, 255, 0.6);
            font-size: 16px;
            margin-bottom: 24px;
        }

        /* ============================================
           ВИДЕОКОНТЕЙНЕР
           ============================================ */
        .video-container {
            position: relative;
            width: 100%;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .video-container iframe {
            width: 100%;
            height: 500px;
            display: block;
            border: none;
        }

        /* ============================================
           ЗАЩИТА ОТ КОПИРОВАНИЯ ССЫЛКИ
           ============================================ */
        .blocked-page {
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 20px;
            text-align: center;
            background: #1a1a2e;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
        }

        .blocked-page.active {
            display: flex;
        }

        .blocked-page .block-card {
            max-width: 500px;
            padding: 40px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        .blocked-page .block-card h1 {
            color: #721c24;
            font-size: 48px;
            margin-bottom: 16px;
        }

        .blocked-page .block-card h2 {
            color: #721c24;
            margin-bottom: 16px;
        }

        .blocked-page .block-card p {
            color: #555;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .blocked-page .block-card a {
            display: inline-block;
            padding: 12px 32px;
            background: #6a1b9a;
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .blocked-page .block-card a:hover {
            background: #4a148c;
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(74, 20, 140, 0.3);
        }

        /* ============================================
           АДАПТИВ
           ============================================ */
        @media (max-width: 768px) {
            .video-page {
                padding: 16px;
            }

            .video-page h1 {
                font-size: 22px;
            }

            .video-container iframe {
                height: 300px;
            }
        }

        @media (max-width: 480px) {
            .video-page {
                padding: 12px;
                border-radius: 12px;
            }

            .video-page h1 {
                font-size: 18px;
            }

            .video-container iframe {
                height: 220px;
            }
        }
    </style>
</head>
<body>

    <!-- БЛОК ЗАЩИТЫ (показывается если доступ запрещен) -->
    <div id="blocked-page" class="blocked-page">
        <div class="block-card">
            <h1>🚫</h1>
            <h2>Доступ запрещен</h2>
            <p id="blocked-message">Пожалуйста, пройдите авторизацию.</p>
            <a href="../main.html">Вернуться на главную</a>
        </div>
    </div>

    <!-- ОСНОВНОЙ КОНТЕНТ -->
    <div id="video-page" class="video-page" style="display: none;">
        <h1>📹 Урок 1-1. Подключение к 1С</h1>
        <p class="video-subtitle">В этом видео вы узнаете, как подключиться к удаленной базе 1С</p>

        <div class="video-container">
            <!-- ВСТРАИВАЕМ ВИДЕО С GOOGLE DRIVE -->
            <!-- FILE_ID: 1scUR7OpqvZiw3YoZQp2AtQ9BzzQKiU8k -->
            <iframe 
                src="https://drive.google.com/file/d/1scUR7OpqvZiw3YoZQp2AtQ9BzzQKiU8k/preview" 
                allow="autoplay; fullscreen" 
                allowfullscreen>
            </iframe>
        </div>
    </div>

    <script>
        // ============================================
        // ЗАЩИТА ОТ КОПИРОВАНИЯ ССЫЛКИ
        // ============================================

        // Настройки (должны совпадать с основными)
        const GIST_ID = 'cab13aea931be6989a1c2ac9fa48717a';
        const GIST_FILENAME = 'status.txt';
        const SESSION_DURATION = 2 * 60 * 60 * 1000; // 2 часа

        // Проверка доступа
        function validateAccess() {
    // Убираем проверку токена в URL
    // const urlToken = urlParams.get('token');
    
    const savedToken = sessionStorage.getItem('access_token');
    const surname = sessionStorage.getItem('user_surname');
    const loginTime = parseInt(sessionStorage.getItem('login_time') || '0');
    const currentTime = Date.now();

    if (!surname) {
        console.log('❌ Нет фамилии в сессии');
        return false;
    }

    // Проверяем только наличие токена в sessionStorage
    if (!savedToken) {
        console.log('❌ Нет токена в сессии');
        return false;
    }

    if (currentTime - loginTime > SESSION_DURATION) {
        console.log('❌ Сеанс истек');
        return false;
    }

    console.log('✅ Проверка пройдена для:', surname);
    return true;
}

        async function checkGistAccess(surname) {
            try {
                const response = await fetch(`https://api.github.com/gists/${GIST_ID}`);
                if (!response.ok) {
                    throw new Error('Ошибка загрузки Gist');
                }

                const gistData = await response.json();
                const fileContent = gistData.files[GIST_FILENAME];

                if (!fileContent) {
                    throw new Error('Файл не найден');
                }

                const lines = fileContent.content.split('\n')
                    .map(line => line.trim())
                    .filter(line => line.length > 0);

                for (const line of lines) {
                    const parts = line.split(/\s+/);
                    if (parts.length >= 2) {
                        const fileSurname = parts[0].toLowerCase();
                        const fileStatus = parts[1];
                        if (fileSurname === surname.toLowerCase() && fileStatus === '+') {
                            return true;
                        }
                    }
                }
                return false;
            } catch (error) {
                console.error('Ошибка проверки Gist:', error);
                return false;
            }
        }

        function showBlockedPage(message) {
            const blockedPage = document.getElementById('blocked-page');
            const videoPage = document.getElementById('video-page');
            const messageEl = document.getElementById('blocked-message');

            if (messageEl) {
                messageEl.textContent = message || 'Пожалуйста, пройдите авторизацию.';
            }

            if (blockedPage) {
                blockedPage.classList.add('active');
            }

            if (videoPage) {
                videoPage.style.display = 'none';
            }
        }

        function showContent() {
            const blockedPage = document.getElementById('blocked-page');
            const videoPage = document.getElementById('video-page');

            if (blockedPage) {
                blockedPage.classList.remove('active');
            }

            if (videoPage) {
                videoPage.style.display = 'block';
            }
        }

        // ============================================
        // ИНИЦИАЛИЗАЦИЯ СТРАНИЦЫ
        // ============================================

        async function init() {
            // Проверяем локальные данные
            if (!validateAccess()) {
                showBlockedPage('Доступ запрещен. Пожалуйста, войдите заново.');
                return;
            }

            // Проверяем через Gist
            const surname = sessionStorage.getItem('user_surname');
            const isActive = await checkGistAccess(surname);

            if (!isActive) {
                showBlockedPage('Ваш доступ был отозван. Обратитесь к администратору.');
                sessionStorage.removeItem('user_surname');
                sessionStorage.removeItem('access_token');
                sessionStorage.removeItem('login_time');
                return;
            }

            // Показываем страницу
            showContent();
        }

        // ============================================
        // ЗАПУСК
        // ============================================

        document.addEventListener('DOMContentLoaded', init);

        console.log('🛡️ Защита видео-страницы активна');
        console.log('📹 Видео загружено с Google Drive');
        console.log('🔒 FILE_ID: 1scUR7OpqvZiw3YoZQp2AtQ9BzzQKiU8k');
    </script>
</body>
</html>
